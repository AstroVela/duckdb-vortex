[package]
name = "vortex-extension"
description = "C-compatible Vortex DuckDB extension artifacts for Vane"
license = "Apache-2.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]
resolver = "2"

[lib]
name = "vortex_duckdb"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]

[dependencies]
vortex-duckdb = { git = "https://github.com/AstroVela/vortex.git", rev = "7ed0870687c712fa61fb3fe1666fc7c1c463c1ea" }
vortex-index-spfresh = { git = "https://github.com/AstroVela/vortex.git", rev = "7ed0870687c712fa61fb3fe1666fc7c1c463c1ea", features = ["native"], optional = true }

[features]
index-spfresh = ["vortex-duckdb/index", "dep:vortex-index-spfresh"]

[profile.dev.package.vortex-fastlanes]
debug = false

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
