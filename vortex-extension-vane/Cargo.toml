[package]
name = "vortex-extension"
description = "C-compatible Vortex DuckDB extension artifacts for Vane"
edition = "2024"
publish = false
build = "build.rs"

[workspace]
resolver = "2"

[lib]
name = "vortex_duckdb"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]

[dependencies]
vortex-duckdb = { git = "https://github.com/AstroVela/vortex.git", rev = "a8ddfd1ffd5f83de7d4dd3c0fd59286f3d5cce6e" }

[profile.dev.package.vortex-fastlanes]
debug = false

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
