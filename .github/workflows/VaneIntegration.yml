name: Vane Extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VANE_EXPECTED_REVISION: e8f5c0805c92b3d9f0d1a258fbeea0b8c883c5c3
  VANE_EXPECTED_PACKAGE_VERSION: 0.2.0.dev607
  VANE_EXPECTED_FORK_VERSION: v1.5.5-vane.e8f5c0805c
  VANE_EXPECTED_DUCKDB_SOURCE_ID: a85c99adc6
  VORTEX_EXPECTED_REVISION: 8eedee91dcf630551ab6b5d8705fad3d853a7c33
  VORTEX_EXPECTED_VERSION: 0.1.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  native-isolation:
    name: Verify native DuckDB isolation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout extension history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject changes to the native build inputs
        shell: bash
        env:
          VANE_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test -n "$VANE_BASE_REF"
          git diff --exit-code "origin/${VANE_BASE_REF}...HEAD" -- \
            duckdb \
            extension-ci-tools \
            extension_config.cmake \
            vcpkg

  vane-extension:
    permissions:
      contents: read
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@1ca9fe2e2e9c33f7422e10055d405fe1b28f1f1c
    with:
      ci_tools_version: 1ca9fe2e2e9c33f7422e10055d405fe1b28f1f1c
      manifest: vane-extension.toml
      build_jobs: 8
      run_native_tests: true

  vane-scan-lifecycle:
    name: Vane scan/write lifecycle (ASAN/LSAN)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/vane-extension.toml
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_SCAN_LIFECYCLE_BUILD_DIR: ${{ github.workspace }}/build/vane-scan-lifecycle
      VANE_BUILD_JOBS: 8
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-scan-lifecycle-ccache
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPILERCHECK: content
      VANE_CMAKE_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Read integration manifest
        id: manifest
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Install CMake, Ninja, and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          python -m pip install "cmake>=3.29" "ninja>=1.10"

      - name: Restore Vane lifecycle compiler cache
        id: lifecycle_ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-scan-write-lifecycle-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}-${{ hashFiles('extension/vortex-extension-vane/Cargo.lock') }}

      - name: Reset Vane lifecycle compiler cache statistics
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Remove verified run-vcpkg state marker
        shell: bash
        env:
          VANE_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
          VANE_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euo pipefail
          marker="$VANE_VCPKG_ROOT/vcpkgLastBuiltCommitId"
          test -f "$marker"
          test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(<"$marker")" = "$VANE_VCPKG_REVISION"
          rm -- "$marker"
          vcpkg_status="$(git -C "$VANE_VCPKG_ROOT" status --porcelain --untracked-files=all)"
          test -z "$vcpkg_status"

      - name: Run Vortex scan/write lifecycle under ASAN and LSAN
        run: |
          make -C extension vane_scan_lifecycle \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_SCAN_LIFECYCLE_BUILD_DIR="$VANE_SCAN_LIFECYCLE_BUILD_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS" \
            VCPKG_TOOLCHAIN_PATH="$VCPKG_TOOLCHAIN_PATH"

      - name: Report Vane lifecycle compiler cache
        if: always()
        shell: bash
        env:
          VANE_CCACHE_ACTION_HIT: ${{ steps.lifecycle_ccache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'GitHub Actions ccache restore hit: %s\n' "${VANE_CCACHE_ACTION_HIT:-false}"
          ccache --show-stats

  vane-wheel-vortex-local:
    name: Installed Vane wheel local-fast Vortex qualification
    needs:
      - vane-extension
      - vane-scan-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      wheel_sha256: ${{ steps.installed_wheel.outputs.wheel_sha256 }}
    env:
      VANE_RUNNER: local-fast
      VANE_FORBIDDEN_SOURCE_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout qualification harness only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the verified Vane Vortex wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vane-vortex-wheel
          path: ${{ runner.temp }}/vane-vortex-wheel

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install and exercise the wheel outside the checkout
        id: installed_wheel
        shell: bash
        env:
          VANE_WHEEL_DIR: ${{ runner.temp }}/vane-vortex-wheel
          VANE_TEST_ROOT: ${{ runner.temp }}/vane-vortex-local-test
          VANE_VENV: ${{ runner.temp }}/vane-vortex-local-venv
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("vane-extension.toml").open("rb") as manifest_file:
              manifest = tomllib.load(manifest_file)
          actual_vane_revision = manifest["vane"]["revision"]
          expected_vane_revision = os.environ["VANE_EXPECTED_REVISION"]
          if actual_vane_revision != expected_vane_revision:
              raise SystemExit(
                  f"Vane manifest revision mismatch: {actual_vane_revision} != {expected_vane_revision}"
              )

          with Path("vortex-extension-vane/Cargo.lock").open("rb") as lock_file:
              lock = tomllib.load(lock_file)
          vortex_packages = [
              package for package in lock["package"] if package["name"] == "vortex-duckdb"
          ]
          if len(vortex_packages) != 1:
              raise SystemExit("Cargo.lock must contain exactly one vortex-duckdb package")
          expected_vortex_revision = os.environ["VORTEX_EXPECTED_REVISION"]
          expected_vortex_source = (
              "git+https://github.com/AstroVela/vortex.git"
              f"?rev={expected_vortex_revision}#{expected_vortex_revision}"
          )
          package = vortex_packages[0]
          if package.get("source") != expected_vortex_source:
              raise SystemExit(
                  f"Vortex Cargo source mismatch: {package.get('source')} != {expected_vortex_source}"
              )
          if package["version"] != os.environ["VORTEX_EXPECTED_VERSION"]:
              raise SystemExit(
                  "Vortex Cargo version mismatch: "
                  f"{package['version']} != {os.environ['VORTEX_EXPECTED_VERSION']}"
              )
          PY

          mapfile -t wheels < <(find "$VANE_WHEEL_DIR" -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          test "${#wheels[@]}" -eq 1
          wheel_sha256="$(sha256sum "${wheels[0]}" | awk '{print $1}')"
          printf 'Vane Vortex wheel SHA256: %s\n' "$wheel_sha256"
          printf 'wheel_sha256=%s\n' "$wheel_sha256" >> "$GITHUB_OUTPUT"

          python -m venv "$VANE_VENV"
          "$VANE_VENV/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "${wheels[0]}"
          mkdir "$VANE_TEST_ROOT"
          install -m 0644 test/vane/vortex_wheel_test_support.py "$VANE_TEST_ROOT/"
          install -m 0644 test/vane/test_vane_wheel_vortex.py "$VANE_TEST_ROOT/"

          cd "$VANE_TEST_ROOT"
          VANE_WHEEL_SHA256="$wheel_sha256" \
            env -u PYTHONHOME -u PYTHONPATH \
            "$VANE_VENV/bin/python" -I test_vane_wheel_vortex.py

  vane-wheel-vortex-ray:
    name: Installed Vane wheel two-node Ray Vortex qualification
    needs:
      - vane-extension
      - vane-wheel-vortex-local
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VANE_RUNNER: ray
      VANE_FORBIDDEN_SOURCE_ROOT: ${{ github.workspace }}
      VANE_LOCAL_WHEEL_SHA256: ${{ needs.vane-wheel-vortex-local.outputs.wheel_sha256 }}
      RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
      RAY_DEDUP_LOGS: "0"
      VANE_UDF_TARGET_MAX_BATCH_BYTES: "4096"

    steps:
      - name: Checkout qualification harness only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the same verified Vane Vortex wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vane-vortex-wheel
          path: ${{ runner.temp }}/vane-vortex-wheel

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Start isolated MinIO
        shell: bash
        run: bash test/object_store/start_minio.sh

      - name: Install and exercise the same wheel on two Ray nodes
        shell: bash
        env:
          VANE_WHEEL_DIR: ${{ runner.temp }}/vane-vortex-wheel
          VANE_TEST_ROOT: ${{ runner.temp }}/vane-vortex-ray-test
          VANE_VENV: ${{ runner.temp }}/vane-vortex-ray-venv
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find "$VANE_WHEEL_DIR" -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          test "${#wheels[@]}" -eq 1
          wheel_sha256="$(sha256sum "${wheels[0]}" | awk '{print $1}')"
          printf 'Vane Vortex wheel SHA256: %s\n' "$wheel_sha256"
          test "$wheel_sha256" = "$VANE_LOCAL_WHEEL_SHA256"

          python -m venv "$VANE_VENV"
          "$VANE_VENV/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "${wheels[0]}"
          mkdir "$VANE_TEST_ROOT"
          install -m 0644 test/object_store/vortex_s3_fault_proxy.py "$VANE_TEST_ROOT/"
          install -m 0644 test/object_store/vortex_s3_test_support.py "$VANE_TEST_ROOT/"
          install -m 0644 test/vane/vortex_wheel_test_support.py "$VANE_TEST_ROOT/"
          install -m 0644 test/vane/test_vane_wheel_ray_vortex.py "$VANE_TEST_ROOT/"

          cd "$VANE_TEST_ROOT"
          VANE_WHEEL_SHA256="$wheel_sha256" \
            env \
              -u PYTHONHOME \
              -u PYTHONPATH \
              -u AWS_ACCESS_KEY_ID \
              -u AWS_SECRET_ACCESS_KEY \
              -u AWS_SESSION_TOKEN \
              -u AWS_PROFILE \
              -u AWS_DEFAULT_PROFILE \
              -u AWS_SHARED_CREDENTIALS_FILE \
              -u AWS_CONFIG_FILE \
              -u AWS_WEB_IDENTITY_TOKEN_FILE \
              -u AWS_ROLE_ARN \
              -u AWS_ROLE_SESSION_NAME \
              -u AWS_CONTAINER_CREDENTIALS_RELATIVE_URI \
              -u AWS_CONTAINER_CREDENTIALS_FULL_URI \
              -u AWS_CONTAINER_AUTHORIZATION_TOKEN \
              -u AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE \
              -u AWS_CREDENTIAL_FILE \
              -u AWS_SECURITY_TOKEN \
            "$VANE_VENV/bin/python" -I test_vane_wheel_ray_vortex.py

      - name: Stop isolated MinIO
        if: always()
        shell: bash
        run: docker rm --force vortex-minio >/dev/null 2>&1 || true
