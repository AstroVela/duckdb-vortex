name: Vane provider release

on:
  push:
    branches:
      - v1.5-variegata_vane
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Run CI, publish dev wheels to TestPyPI, or stage and promote a production release
        type: choice
        options:
          - build-only
          - testpypi-dev
          - release
        default: build-only
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ inputs.operation || 'ci' }}
  cancel-in-progress: ${{ inputs.operation != 'testpypi-dev' && inputs.operation != 'release' }}

permissions:
  contents: read

env:
  VANE_EXPECTED_PACKAGE_VERSION: 0.2.0.dev660
  VANE_EXPECTED_FORK_VERSION: v1.5.5-vane.4e12994a2f
  VANE_EXPECTED_DUCKDB_SOURCE_ID: f3f78689a6bae92ff43c46d16c881cb363f0cfc6

jobs:
  vane-provider-release-tooling:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Validate Vortex provider release tooling
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact shared release tooling
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt pytest pyyaml

      - name: Exercise the provider release and native packaging contracts
        run: |
          python -I test/vane/test_vane_provider_release.py
          python -I test/vane/test_vane_dynamic_wheel.py
          python -I test/vane/test_vane_runtime_identity.py
          python -I -m pytest -q test/vane/test_vane_dynamic_signing.py test/vane/test_vane_production_release.py

  vane-dynamic-wheel:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Build signed Vane dynamic Vortex wheel
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0bf9db09181f36be8cf0628332abb5d31855b7d0f372faa776f492ccd9d3100d
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_INCREMENTAL: "0"
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/vane-extension.toml
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_DYNAMIC_BUILD_DIR: ${{ github.workspace }}/build/vane-dynamic-wheel
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/build/vane-dynamic-wheel-dist
      VANE_VCPKG_ROOT: ${{ github.workspace }}/vane-vcpkg
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_BUILD_JOBS: 8
      VANE_CMAKE_COMPILER_LAUNCHER: ccache
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_BINARY_SOURCES: clear
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-dynamic-wheel-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Select manylinux CPython
        shell: bash
        run: |
          set -euo pipefail
          python_directory=/opt/python/cp312-cp312/bin
          test -x "$python_directory/python"
          echo "$python_directory" >> "$GITHUB_PATH"
          "$python_directory/python" --version

      - name: Read integration manifest
        id: manifest
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact Vane and CI-tools identities
        shell: bash
        env:
          VANE_CI_TOOLS_VERSION: 618aec05ad68c8c130c69505b1fd99311fc9f47d
        run: |
          set -euo pipefail
          actual_ci_tools="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual_ci_tools" = "$VANE_CI_TOOLS_VERSION"
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            verify-ci-tools \
            --ci-tools-source extension/vane-extension-ci-tools \
            --expected-sha "$VANE_CI_TOOLS_VERSION"
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Install native and wheel tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            autoconf \
            automake \
            ccache \
            clang \
            clang-devel \
            curl \
            file \
            flex \
            gcc \
            gcc-c++ \
            git \
            libtool \
            m4 \
            make \
            ninja-build \
            openssl \
            openssl-devel \
            patch \
            perl-IPC-Cmd \
            perl-Time-Piece \
            pkgconf-pkg-config \
            tar \
            unzip \
            xz \
            zip
          python -m pip install \
            "auditwheel>=6.4" \
            build \
            "cmake>=3.29" \
            "ninja>=1.10" \
            -r extension/vane-extension-ci-tools/requirements-release.txt \
            "patchelf>=0.17.2" \
            "pybind11[global]>=3.0.0" \
            "scikit-build-core>=0.11.4" \
            "setuptools-scm>=9.2.0"

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install checksum-pinned Rust license tooling
        shell: bash
        run: |
          set -euo pipefail
          cargo_about_directory="$RUNNER_TEMP/cargo-about"
          mkdir -p "$cargo_about_directory"
          cargo_about_archive="$cargo_about_directory/cargo-about.tar.gz"
          curl --fail --location --retry 5 --retry-delay 5 \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$cargo_about_archive"
          printf '%s  %s\n' \
            9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af \
            "$cargo_about_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$cargo_about_archive" --strip-components=1 \
            --directory "$cargo_about_directory"
          test -x "$cargo_about_directory/cargo-about"
          "$cargo_about_directory/cargo-about" --version
          printf 'VANE_CARGO_ABOUT=%s\n' "$cargo_about_directory/cargo-about" >> "$GITHUB_ENV"

      - name: Build pinned Bison with the exact Vane bootstrap
        shell: bash
        env:
          VANE_BISON_INSTALL_PREFIX: ${{ runner.temp }}/vane-bison-3.8.2
          VANE_BUILD_TOOLS_DIR: ${{ runner.temp }}/vane-build-tools
        run: |
          set -euo pipefail
          bash "$VANE_SOURCE_DIR/scripts/bootstrap_manylinux_bison.sh"
          echo "$VANE_BISON_INSTALL_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'VANE_BISON=%s\n' "$VANE_BISON_INSTALL_PREFIX/bin/bison" >> "$GITHUB_ENV"
          "$VANE_BISON_INSTALL_PREFIX/bin/bison" --version
          "$VANE_BISON_INSTALL_PREFIX/bin/bison" --help | grep -F -- '--file-prefix-map'

      - name: Restore dynamic-wheel compiler cache
        id: dynamic_wheel_ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-vortex-dynamic-wheel-ccache-v2-manylinux_2_28-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}-${{ hashFiles('extension/vcpkg.json', 'extension/vane-extension.toml', 'extension/vortex-extension-vane/Cargo.lock', 'extension/rust-toolchain.toml') }}

      - name: Reset dynamic-wheel compiler cache statistics
        run: ccache --zero-stats

      - name: Set up extension vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Remove verified run-vcpkg state marker
        shell: bash
        env:
          VANE_EXTENSION_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
          VANE_EXTENSION_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euo pipefail
          marker="$VANE_EXTENSION_VCPKG_ROOT/vcpkgLastBuiltCommitId"
          test -f "$marker"
          test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(<"$marker")" = "$VANE_EXTENSION_VCPKG_REVISION"
          rm -- "$marker"
          vcpkg_status="$(git -C "$VANE_EXTENSION_VCPKG_ROOT" status --porcelain --untracked-files=all)"
          test -z "$vcpkg_status"

      - name: Bootstrap exact Vane dependencies
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          test "$(command -v bison)" = "$VANE_BISON"
          bison --help | grep -F -- '--file-prefix-map'
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_wheel_dependencies \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_VCPKG_ROOT="$VANE_VCPKG_ROOT" \
            VANE_VCPKG_INSTALLED_DIR="$VANE_VCPKG_INSTALLED_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS"

      - name: Build and verify dynamic provider wheel
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MAX_CONCURRENCY: ${{ env.VANE_BUILD_JOBS }}
        run: |
          python -I extension/scripts/build_vane_dynamic_wheel.py \
            --extension-root "$VANE_EXTENSION_ROOT" \
            --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --vane-vcpkg-installed "$VANE_VCPKG_INSTALLED_DIR" \
            --vcpkg-toolchain "$VCPKG_TOOLCHAIN_PATH" \
            --cargo-about "$VANE_CARGO_ABOUT" \
            --build-directory "$VANE_DYNAMIC_BUILD_DIR" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --jobs "$VANE_BUILD_JOBS" \
            --signing-profile ci-test \
            --signing-private-key "$VANE_SOURCE_DIR/external/duckdb/test/mbedtls/private.pem" \
            --package-local-runtime

      - name: Validate the provider matrix and TestPyPI size budget in CI
        shell: bash
        run: |
          set -euo pipefail
          # CI builds one interpreter; use the shared release validator with
          # an explicit one-interpreter config, leaving the full release matrix intact.
          python - "$VANE_EXTENSION_ROOT" "$VANE_DYNAMIC_DIST_DIR" <<'PY'
          import pathlib
          import shutil
          import sys

          root, dist = map(pathlib.Path, sys.argv[1:])
          config = (root / "vane-provider-release.toml").read_text()
          original = 'interpreters = ["cp310", "cp311", "cp312", "cp313", "cp314"]'
          if config.count(original) != 1:
              raise SystemExit("unexpected provider release interpreter matrix")
          config_path = dist.parent / "ci-provider-release.toml"
          config_path.write_text(config.replace(original, 'interpreters = ["cp312"]'))
          selected = dist.parent / "ci-provider-wheels"
          selected.mkdir()
          for wheel in dist.glob("vane_extension_vortex-*.whl"):
              shutil.copyfile(wheel, selected / wheel.name)
          PY
          python -I extension/vane-extension-ci-tools/scripts/vane_provider_release.py validate --channel testpypi-dev \
            --manifest "$VANE_MANIFEST" --extension-root "$VANE_EXTENSION_ROOT" \
            --vane-source "$VANE_SOURCE_DIR" \
            --ci-tools-version "$(git -C "$VANE_EXTENSION_ROOT" rev-parse HEAD:vane-extension-ci-tools)" \
            --config "$(dirname "$VANE_DYNAMIC_DIST_DIR")/ci-provider-release.toml" \
            --directory "$(dirname "$VANE_DYNAMIC_DIST_DIR")/ci-provider-wheels" \
            --vane-version "$VANE_EXPECTED_PACKAGE_VERSION"

      - name: Report dynamic-wheel compiler cache
        if: always()
        shell: bash
        env:
          VANE_CCACHE_ACTION_HIT: ${{ steps.dynamic_wheel_ccache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'GitHub Actions ccache restore hit: %s\n' "${VANE_CCACHE_ACTION_HIT:-false}"
          ccache --show-stats

      - name: Upload CI-only dynamic wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-vortex-dynamic-wheels
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 1

  vane-dynamic-vortex-integration:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Vane dynamic wheel default Ray Vortex smoke
    needs: vane-dynamic-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: vane-ci-test-key

    steps:
      - name: Checkout extension
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified dynamic wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-vortex-dynamic-wheels
          path: vane-wheels

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Exercise Vortex through the packaged provider wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-vane-wheel-integration
          . .venv-vane-wheel-integration/bin/activate
          mapfile -t base_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          mapfile -t vortex_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_vortex-*.whl' -print | sort)
          test "${#base_wheels[@]}" -eq 1
          test "${#vortex_wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check \
            "${base_wheels[0]}" "${vortex_wheels[0]}"
          python -I test/vane/test_vane_dynamic_vortex.py --smoke

  vane-dynamic-ray-vortex-integration:
    if: inputs.operation != 'testpypi-dev' && inputs.operation != 'release'
    name: Vane dynamic wheel two-worker Ray Vortex integration
    needs: vane-dynamic-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: vane-ci-test-key
      RAY_DEDUP_LOGS: "0"
      VANE_UDF_TARGET_MAX_BATCH_BYTES: "4096"

    steps:
      - name: Checkout extension
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified dynamic wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: vane-vortex-dynamic-wheels
          path: vane-wheels

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Exercise Vortex through two Ray workers
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-vane-wheel-ray-integration
          . .venv-vane-wheel-ray-integration/bin/activate
          mapfile -t base_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_ai-*.whl' -print | sort)
          mapfile -t vortex_wheels < <(find vane-wheels -maxdepth 1 -type f -name 'vane_extension_vortex-*.whl' -print | sort)
          test "${#base_wheels[@]}" -eq 1
          test "${#vortex_wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check \
            "${base_wheels[0]}" "${vortex_wheels[0]}"
          python -I test/vane/test_vane_dynamic_vortex.py

  provider-release-preflight:
    if: inputs.operation == 'testpypi-dev' || inputs.operation == 'release'
    name: Verify the protected provider release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      vane_version: ${{ steps.release.outputs.vane_version }}
      fork_version: ${{ steps.identity.outputs.fork_version }}
      source_id: ${{ steps.identity.outputs.source_id }}
    env:
      VANE_MANIFEST: ${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
    steps:
      - name: Require the protected official release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = AstroVela/duckdb-vortex
          test "$GITHUB_REF" = refs/heads/v1.5-variegata_vane
          test "$GITHUB_REF_PROTECTED" = true

      - name: Checkout release inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize pinned Vane CI tools
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release preflight tooling
        run: python -m pip install -r vane-extension-ci-tools/requirements-release.txt "setuptools-scm>=9.2.0"

      - name: Read the selected exact integration manifest
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source including version history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Reject invalid release inputs before native builds or key access
        id: release
        env:
          RELEASE_CHANNEL: ${{ inputs.operation }}
        run: |
          python -I scripts/vane_release_preflight.py \
            --channel "$RELEASE_CHANNEL" \
            --manifest "$VANE_MANIFEST" --extension-root . \
            --vane-source vane \
            --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve exact native smoke-test identities from the selected source
        id: identity
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" --extension-root . \
            identity --vane-source vane --github-output "$GITHUB_OUTPUT"

  vane-provider-prepare:
    needs: provider-release-preflight
    name: Prepare unsigned Vortex native data without secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0bf9db09181f36be8cf0628332abb5d31855b7d0f372faa776f492ccd9d3100d
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    env:
      SIGNING_PROFILE: ${{ inputs.operation == 'release' && 'production' || 'testpypi' }}
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_INCREMENTAL: "0"
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_DYNAMIC_BUILD_DIR: ${{ github.workspace }}/build/vane-testpypi-wheel
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/build/vane-testpypi-wheel-dist
      VANE_VCPKG_ROOT: ${{ github.workspace }}/vane-vcpkg
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_PYTHON: /opt/python/cp312-cp312/bin/python
      VANE_BUILD_JOBS: 8
      VANE_CMAKE_COMPILER_LAUNCHER: ccache
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-archives
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-testpypi-wheel-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Require the protected release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/v1.5-variegata_vane

      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Read integration manifest
        id: manifest
        shell: bash
        run: |
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Install native and wheel tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            autoconf \
            automake \
            ccache \
            clang \
            clang-devel \
            curl \
            file \
            flex \
            gcc \
            gcc-c++ \
            git \
            libtool \
            m4 \
            make \
            ninja-build \
            openssl \
            openssl-devel \
            patch \
            perl-IPC-Cmd \
            perl-Time-Piece \
            pkgconf-pkg-config \
            tar \
            unzip \
            xz \
            zip
          "$VANE_PYTHON" -m pip install \
            "auditwheel>=6.4" \
            build \
            "cmake>=3.29" \
            "ninja>=1.10" \
            -r extension/vane-extension-ci-tools/requirements-release.txt \
            "patchelf>=0.17.2" \
            "pybind11[global]>=3.0.0" \
            "scikit-build-core>=0.11.4" \
            "setuptools-scm>=9.2.0"
          echo "$(dirname "$VANE_PYTHON")" >> "$GITHUB_PATH"

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install checksum-pinned Rust license tooling
        shell: bash
        run: |
          set -euo pipefail
          cargo_about_directory="$RUNNER_TEMP/cargo-about"
          mkdir -p "$cargo_about_directory"
          cargo_about_archive="$cargo_about_directory/cargo-about.tar.gz"
          curl --fail --location --retry 5 --retry-delay 5 \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$cargo_about_archive"
          printf '%s  %s\n' \
            9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af \
            "$cargo_about_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$cargo_about_archive" --strip-components=1 \
            --directory "$cargo_about_directory"
          test -x "$cargo_about_directory/cargo-about"
          "$cargo_about_directory/cargo-about" --version
          printf 'VANE_CARGO_ABOUT=%s\n' "$cargo_about_directory/cargo-about" >> "$GITHUB_ENV"

      - name: Build pinned Bison with the exact Vane bootstrap
        shell: bash
        env:
          VANE_BISON_INSTALL_PREFIX: ${{ runner.temp }}/vane-bison-3.8.2
          VANE_BUILD_TOOLS_DIR: ${{ runner.temp }}/vane-build-tools
        run: |
          set -euo pipefail
          bash "$VANE_SOURCE_DIR/scripts/bootstrap_manylinux_bison.sh"
          echo "$VANE_BISON_INSTALL_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'VANE_BISON=%s\n' "$VANE_BISON_INSTALL_PREFIX/bin/bison" >> "$GITHUB_ENV"
          "$VANE_BISON_INSTALL_PREFIX/bin/bison" --version
          "$VANE_BISON_INSTALL_PREFIX/bin/bison" --help | grep -F -- '--file-prefix-map'

      - name: Validate exact Vane and CI-tools identities
        shell: bash
        env:
          VANE_CI_TOOLS_VERSION: 618aec05ad68c8c130c69505b1fd99311fc9f47d
        run: |
          set -euo pipefail
          actual_ci_tools="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual_ci_tools" = "$VANE_CI_TOOLS_VERSION"
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            verify-ci-tools \
            --ci-tools-source extension/vane-extension-ci-tools \
            --expected-sha "$VANE_CI_TOOLS_VERSION"
          "$VANE_PYTHON" extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Restore compiler and package caches
        id: testpypi_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vane-vortex-testpypi-wheel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}-${{ hashFiles('extension/vcpkg.json', 'extension/vane-extension*.toml', 'extension/vortex-extension-vane/Cargo.lock', 'extension/rust-toolchain.toml') }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Set up extension vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Remove verified run-vcpkg state marker
        shell: bash
        env:
          VANE_EXTENSION_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
          VANE_EXTENSION_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euo pipefail
          marker="$VANE_EXTENSION_VCPKG_ROOT/vcpkgLastBuiltCommitId"
          test -f "$marker"
          test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(<"$marker")" = "$VANE_EXTENSION_VCPKG_REVISION"
          rm -- "$marker"
          vcpkg_status="$(git -C "$VANE_EXTENSION_VCPKG_ROOT" status --porcelain --untracked-files=all)"
          test -z "$vcpkg_status"

      - name: Bootstrap exact Vane dependencies
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VANE_BOOTSTRAP_PYTHON: ${{ env.VANE_PYTHON }}
        run: |
          set -euo pipefail
          test "$(command -v bison)" = "$VANE_BISON"
          bison --help | grep -F -- '--file-prefix-map'
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_wheel_dependencies \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_VCPKG_ROOT="$VANE_VCPKG_ROOT" \
            VANE_VCPKG_INSTALLED_DIR="$VANE_VCPKG_INSTALLED_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS" \
            VANE_PYTHON="$VANE_PYTHON"

      - name: Prepare the unsigned native and license bundle
        shell: bash
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MAX_CONCURRENCY: ${{ env.VANE_BUILD_JOBS }}
        run: |
          set -euo pipefail
          "$VANE_PYTHON" -I extension/scripts/build_vane_dynamic_wheel.py \
            --phase prepare --extension-root "$VANE_EXTENSION_ROOT" \
            --manifest "$VANE_MANIFEST" --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --vane-vcpkg-installed "$VANE_VCPKG_INSTALLED_DIR" \
            --vcpkg-toolchain "$VCPKG_TOOLCHAIN_PATH" \
            --cargo-about "$VANE_CARGO_ABOUT" \
            --build-directory "$VANE_DYNAMIC_BUILD_DIR" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --jobs "$VANE_BUILD_JOBS" --signing-profile "$SIGNING_PROFILE"

      - name: Report compiler cache
        if: always()
        shell: bash
        run: ccache --show-stats

      - name: Upload unsigned native data and reviewed license notices
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-vortex-unsigned-native
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/
          if-no-files-found: error
          retention-days: 30

  vane-provider-sign:
    name: Sign native data without build or package dependencies
    needs: vane-provider-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.operation == 'release' && 'production-signing' || 'testpypi' }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
    env:
      SIGNING_PROFILE: ${{ inputs.operation == 'release' && 'production' || 'testpypi' }}
    steps:
      - name: Checkout the reviewed signer and committed manifest
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          persist-credentials: false

      - name: Read signer inputs only from the committed manifest
        id: manifest
        run: |
          /usr/bin/python3 -I -S extension/scripts/sign_vane_dynamic_bundle.py manifest \
            --profile "$SIGNING_PROFILE" --extension-root extension \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout the exact official stdlib signing utility
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: AstroVela/vane
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          persist-credentials: false

      - name: Download the original unsigned bundle by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.vane-provider-prepare.outputs.artifact_id }}
          merge-multiple: true
          path: prepared
          digest-mismatch: error

      - name: Fingerprint and consume the key while signing native data only
        env:
          VANE_PROVIDER_SIGNING_PRIVATE_KEY: ${{ secrets[inputs.operation == 'release' && 'VANE_EXTENSION_SIGNING_PRIVATE_KEY' || 'VANE_TESTPYPI_EXTENSION_SIGNING_PRIVATE_KEY'] }}
        run: |
          /usr/bin/python3 -I -S extension/scripts/sign_vane_dynamic_bundle.py sign \
            --profile "$SIGNING_PROFILE" --extension-root extension \
            --vane-source vane --input-directory prepared --output-directory signed

      - name: Upload only the signed native artifact
        id: signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-vortex-signed-native
          path: signed/vortex.duckdb_extension
          if-no-files-found: error
          retention-days: 30

  vane-testpypi-wheels:
    name: Package and verify signed provider wheels without secrets
    needs: [provider-release-preflight, vane-provider-prepare, vane-provider-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0bf9db09181f36be8cf0628332abb5d31855b7d0f372faa776f492ccd9d3100d
    permissions:
      contents: read
    outputs:
      vortex_version: ${{ steps.release.outputs.vortex_version }}
      vane_version: ${{ needs.provider-release-preflight.outputs.vane_version }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
      fork_version: ${{ needs.provider-release-preflight.outputs.fork_version }}
      source_id: ${{ needs.provider-release-preflight.outputs.source_id }}
    env:
      SIGNING_PROFILE: ${{ inputs.operation == 'release' && 'production' || 'testpypi' }}
      VANE_DYNAMIC_DIST_DIR: ${{ github.workspace }}/build/vane-provider-dist
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}
      VANE_PYTHON: /opt/python/cp312-cp312/bin/python
      VANE_RUNTIME_WHEEL_DIR: ${{ github.workspace }}/build/vane-indexed-runtime-wheels
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
    steps:
      - name: Checkout the reviewed packaging inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          persist-credentials: false

      - name: Initialize pinned packaging tools
        run: git -C extension submodule update --init vane-extension-ci-tools

      - name: Read the selected exact manifest
        id: manifest
        run: |
          "$VANE_PYTHON" -I extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" --extension-root "$VANE_EXTENSION_ROOT" \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane verification tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Install package validation tooling without native build tools
        run: |
          dnf install -y binutils file
          "$VANE_PYTHON" -m pip install \
            -r extension/vane-extension-ci-tools/requirements-release.txt

      - name: Download the original license bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.vane-provider-prepare.outputs.artifact_id }}
          merge-multiple: true
          path: prepared
          digest-mismatch: error

      - name: Download the original signed native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.vane-provider-sign.outputs.artifact_id }}
          merge-multiple: true
          path: signed
          digest-mismatch: error

      - name: Download every exact indexed Vane runtime wheel
        shell: bash
        env:
          INDEX_URL: ${{ inputs.operation == 'release' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
          VANE_VERSION: ${{ needs.provider-release-preflight.outputs.vane_version }}
        run: |
          set -euo pipefail
          unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_FIND_LINKS
          export PIP_CONFIG_FILE=/dev/null
          mkdir -p "$VANE_RUNTIME_WHEEL_DIR"
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            destination="$VANE_RUNTIME_WHEEL_DIR/$runtime"
            mkdir -p "$destination"
            "/opt/python/$runtime/bin/python" -m pip download \
              --disable-pip-version-check --no-cache-dir --no-deps \
              --only-binary=:all: --index-url "$INDEX_URL" \
              --dest "$destination" "vane-ai==$VANE_VERSION"
            test "$(find "$destination" -maxdepth 1 -type f -name 'vane_ai-*.whl' | wc -l)" -eq 1
          done

      - name: Package signed bytes and verify against every indexed runtime
        shell: bash
        env:
          VANE_VERSION: ${{ needs.provider-release-preflight.outputs.vane_version }}
        run: |
          set -euo pipefail
          runtime_arguments=()
          for runtime in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            mapfile -t wheels < <(find "$VANE_RUNTIME_WHEEL_DIR/$runtime" \
              -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
            test "${#wheels[@]}" -eq 1
            runtime_arguments+=(
              --runtime-python "/opt/python/$runtime/bin/python"
              --runtime-wheel "${wheels[0]}"
            )
          done
          "$VANE_PYTHON" -I extension/scripts/package_vane_dynamic_wheel.py \
            --extension-root "$VANE_EXTENSION_ROOT" \
            --manifest "$VANE_MANIFEST" --vane-source "$VANE_SOURCE_DIR" \
            --vane-revision "${{ steps.manifest.outputs.vane_revision }}" \
            --vane-version "$VANE_VERSION" \
            --output-directory "$VANE_DYNAMIC_DIST_DIR" \
            --signing-profile "$SIGNING_PROFILE" \
            --unsigned-directory "$GITHUB_WORKSPACE/prepared" \
            --signed-directory "$GITHUB_WORKSPACE/signed" \
            "${runtime_arguments[@]}"

      - name: Validate the immutable publishable release set
        id: release
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ inputs.operation }}
          VANE_VERSION: ${{ needs.provider-release-preflight.outputs.vane_version }}
        run: |
          set -euo pipefail
          publish_arguments=(--require-publishable-on testpypi)
          if [ "$RELEASE_CHANNEL" = release ]; then
            publish_arguments+=(--require-publishable-on pypi)
          fi
          "$VANE_PYTHON" -I extension/vane-extension-ci-tools/scripts/vane_provider_release.py validate \
            --manifest "$VANE_MANIFEST" --extension-root "$VANE_EXTENSION_ROOT" \
            --vane-source "$VANE_SOURCE_DIR" --ci-tools-version "$(git -C "$VANE_EXTENSION_ROOT" rev-parse HEAD:vane-extension-ci-tools)" \
            --config "$VANE_EXTENSION_ROOT/vane-provider-release.toml" \
            --directory "$VANE_DYNAMIC_DIST_DIR" --vane-version "$VANE_VERSION" \
            --channel "$RELEASE_CHANNEL" "${publish_arguments[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload verified Vortex provider wheels
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-vortex-wheels
          path: ${{ env.VANE_DYNAMIC_DIST_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 30

  assemble-testpypi-vortex:
    name: Validate, attest, and sign TestPyPI Vortex provider
    needs: vane-testpypi-wheels
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      vortex_version: ${{ needs.vane-testpypi-wheels.outputs.vortex_version }}
      vane_version: ${{ needs.vane-testpypi-wheels.outputs.vane_version }}
      artifact_id: ${{ steps.distributions.outputs.artifact-id }}
      fork_version: ${{ needs.vane-testpypi-wheels.outputs.fork_version }}
      source_id: ${{ needs.vane-testpypi-wheels.outputs.source_id }}
    env:
      VANE_MANIFEST: ${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Initialize pinned Vane CI tools
        run: git submodule update --init vane-extension-ci-tools

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read integration manifest
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for release verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download Vortex provider wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.vane-testpypi-wheels.outputs.artifact_id }}
          merge-multiple: true
          path: packages

      - name: Revalidate the complete release set
        env:
          RELEASE_CHANNEL: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          publish_arguments=(--require-publishable-on testpypi)
          if [ "$RELEASE_CHANNEL" = release ]; then
            publish_arguments+=(--require-publishable-on pypi)
          fi
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py validate \
            --manifest "$VANE_MANIFEST" --extension-root . \
            --vane-source vane --ci-tools-version "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml \
            --directory packages \
            --vane-version "${{ needs.vane-testpypi-wheels.outputs.vane_version }}" \
            --channel "$RELEASE_CHANNEL" \
            "${publish_arguments[@]}"

      - name: Assemble distributions and checksums
        run: |
          mkdir -p distributions release-assets
          cp packages/vane_extension_vortex-*.whl distributions/
          (cd packages && sha256sum -- ./*.whl) > release-assets/SHA256SUMS

      - name: Generate a CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: packages
          format: cyclonedx-json
          output-file: release-assets/vane-extension-vortex-sbom.cdx.json
          upload-artifact: false

      - name: Attest provider provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/packages/*

      - name: Preserve the provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            release-assets/vane-extension-vortex-build-provenance.sigstore.json

      - name: Sign provider distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: packages/*.whl

      - name: Upload Vortex distributions
        id: distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-vortex-distributions
          path: distributions/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-testpypi-vortex-supplemental
          path: |
            release-assets/*
            packages/*.sigstore.json
          if-no-files-found: error
          retention-days: 30

  publish-testpypi-vortex:
    name: Publish Vortex provider to TestPyPI
    needs: assemble-testpypi-vortex
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vane-extension-vortex
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Vortex distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-vortex.outputs.artifact_id }}
          merge-multiple: true
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi-vortex:
    name: Verify indexed Vortex provider
    needs: [assemble-testpypi-vortex, publish-testpypi-vortex]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VANE_MANIFEST: ${{ inputs.operation == 'release' && 'vane-extension-release.toml' || 'vane-extension.toml' }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Initialize pinned Vane CI tools
        run: git submodule update --init vane-extension-ci-tools

      - name: Install release validation tooling
        run: python -m pip install --disable-pip-version-check -r vane-extension-ci-tools/requirements-release.txt

      - name: Read integration manifest
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for release verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 1
          persist-credentials: false

      - name: Download Vortex distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-vortex.outputs.artifact_id }}
          merge-multiple: true
          path: dist

      - name: Compare the immutable indexed release
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-index \
            --manifest "$VANE_MANIFEST" --extension-root . \
            --vane-source vane --ci-tools-version "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml --provider vortex \
            --directory dist --index testpypi \
            --version "${{ needs.assemble-testpypi-vortex.outputs.vortex_version }}"

  testpypi-smoke-vortex-integration:
    name: TestPyPI default Ray Vortex smoke
    needs: [assemble-testpypi-vortex, verify-testpypi-vortex]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: ${{ inputs.operation == 'release' && 'astrovela/vane' || 'astrovela/vane-testpypi' }}
      VANE_EXPECTED_PACKAGE_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vane_version }}
      VANE_EXPECTED_FORK_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.fork_version }}
      VANE_EXPECTED_DUCKDB_SOURCE_ID: ${{ needs.assemble-testpypi-vortex.outputs.source_id }}
      VANE_RUNTIME_INDEX_URL: ${{ inputs.operation == 'release' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
      INDEX_URL: https://test.pypi.org/simple/

    steps:
      - name: Checkout extension tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download expected Vortex distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-vortex.outputs.artifact_id }}
          merge-multiple: true
          path: expected/vortex

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the exact indexed package graph
        shell: bash
        env:
          VANE_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vane_version }}
          VORTEX_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vortex_version }}
        run: |
          set -euo pipefail
          python -m venv .venv-vane-testpypi-smoke
          . .venv-vane-testpypi-smoke/bin/activate
          unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_FIND_LINKS
          export PIP_CONFIG_FILE=/dev/null
          python -m pip install --upgrade pip
          mkdir -p indexed
          download_exact() {
            local requirement="$1"
            for attempt in 1 2 3 4 5; do
              if python -m pip download \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-deps \
                --only-binary=:all: \
                --index-url "$INDEX_URL" \
                --dest indexed \
                "$requirement"; then
                return
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep 15
              fi
            done
            return 1
          }
          INDEX_URL="$VANE_RUNTIME_INDEX_URL" download_exact "vane-ai==$VANE_VERSION"
          download_exact "vane-extension-vortex==$VORTEX_VERSION"

          mapfile -t base_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
          mapfile -t vortex_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_extension_vortex-*.whl' -print)
          mapfile -t expected_vortex < <(find expected/vortex -maxdepth 1 -type f -name '*-cp312-none-manylinux_2_28_x86_64.whl' -print)
          test "${#base_wheels[@]}" -eq 1
          test "${#vortex_wheels[@]}" -eq 1
          test "${#expected_vortex[@]}" -eq 1
          cmp "${expected_vortex[0]}" "${vortex_wheels[0]}"
          python -m pip install "${base_wheels[0]}" "${vortex_wheels[0]}"
          python -m pip check

      - name: Exercise the indexed provider with default Ray
        run: .venv-vane-testpypi-smoke/bin/python -I test/vane/test_vane_dynamic_vortex.py --smoke

  testpypi-ray-vortex-integration:
    name: TestPyPI two-worker Ray Vortex integration
    needs: [assemble-testpypi-vortex, verify-testpypi-vortex]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      VANE_EXPECTED_EXTENSION_TRUST_IDENTITY: ${{ inputs.operation == 'release' && 'astrovela/vane' || 'astrovela/vane-testpypi' }}
      VANE_EXPECTED_PACKAGE_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vane_version }}
      VANE_EXPECTED_FORK_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.fork_version }}
      VANE_EXPECTED_DUCKDB_SOURCE_ID: ${{ needs.assemble-testpypi-vortex.outputs.source_id }}
      VANE_RUNTIME_INDEX_URL: ${{ inputs.operation == 'release' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
      VANE_UDF_TARGET_MAX_BATCH_BYTES: "4096"
      RAY_DEDUP_LOGS: "0"
      INDEX_URL: https://test.pypi.org/simple/

    steps:
      - name: Checkout extension tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download expected Vortex distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.assemble-testpypi-vortex.outputs.artifact_id }}
          merge-multiple: true
          path: expected/vortex

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the exact indexed package graph
        shell: bash
        env:
          VANE_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vane_version }}
          VORTEX_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vortex_version }}
        run: |
          set -euo pipefail
          python -m venv .venv-vane-testpypi-ray
          . .venv-vane-testpypi-ray/bin/activate
          unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_FIND_LINKS
          export PIP_CONFIG_FILE=/dev/null
          python -m pip install --upgrade pip
          mkdir -p indexed
          download_exact() {
            local requirement="$1"
            for attempt in 1 2 3 4 5; do
              if python -m pip download \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-deps \
                --only-binary=:all: \
                --index-url "$INDEX_URL" \
                --dest indexed \
                "$requirement"; then
                return
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep 15
              fi
            done
            return 1
          }
          INDEX_URL="$VANE_RUNTIME_INDEX_URL" download_exact "vane-ai==$VANE_VERSION"
          download_exact "vane-extension-vortex==$VORTEX_VERSION"

          mapfile -t base_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_ai-*.whl' -print)
          mapfile -t vortex_wheels < <(find indexed -maxdepth 1 -type f -name 'vane_extension_vortex-*.whl' -print)
          mapfile -t expected_vortex < <(find expected/vortex -maxdepth 1 -type f -name '*-cp312-none-manylinux_2_28_x86_64.whl' -print)
          test "${#base_wheels[@]}" -eq 1
          test "${#vortex_wheels[@]}" -eq 1
          test "${#expected_vortex[@]}" -eq 1
          cmp "${expected_vortex[0]}" "${vortex_wheels[0]}"
          python -m pip install "${base_wheels[0]}" "${vortex_wheels[0]}"
          python -m pip check

      - name: Exercise the indexed provider through two Ray workers
        run: .venv-vane-testpypi-ray/bin/python -I test/vane/test_vane_dynamic_vortex.py

  verify-pypi-promotion:
    if: inputs.operation == 'release'
    name: Approve and verify the immutable Vortex promotion without OIDC
    needs:
      - assemble-testpypi-vortex
      - testpypi-smoke-vortex-integration
      - testpypi-ray-vortex-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/vane-extension-vortex
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize pinned Vane CI tools
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install -r vane-extension-ci-tools/requirements-release.txt

      - name: Read the production integration manifest
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest vane-extension-release.toml --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for promotion verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          persist-credentials: false

      - name: Download the complete immutable candidate set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble-testpypi-vortex.outputs.artifact_id }}
          merge-multiple: true
          path: dist
          digest-mismatch: error

      - name: Recheck exact TestPyPI staging and PyPI publication identities
        env:
          VANE_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vane_version }}
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-promotion \
            --manifest vane-extension-release.toml --extension-root . \
            --vane-source vane --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml --directory dist \
            --vane-version "$VANE_VERSION"

  publish-pypi-vortex:
    if: inputs.operation == 'release'
    name: Publish only the original verified Vortex candidate to PyPI
    needs: [assemble-testpypi-vortex, verify-pypi-promotion]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/vane-extension-vortex
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the original immutable assembled artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble-testpypi-vortex.outputs.artifact_id }}
          merge-multiple: true
          path: dist
          digest-mismatch: error

      - name: Publish the same wheels through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          packages-dir: dist
          repository-url: https://upload.pypi.org/legacy/
          skip-existing: true

  verify-pypi-vortex:
    name: Verify the indexed Vortex production release without OIDC
    needs: [assemble-testpypi-vortex, publish-pypi-vortex]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize pinned Vane CI tools
        run: git submodule update --init vane-extension-ci-tools

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install -r vane-extension-ci-tools/requirements-release.txt

      - name: Read the production integration manifest
        id: manifest
        run: |
          python -I vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest vane-extension-release.toml --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source for index verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          persist-credentials: false

      - name: Download the original immutable assembled artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble-testpypi-vortex.outputs.artifact_id }}
          merge-multiple: true
          path: dist
          digest-mismatch: error

      - name: Verify the exact indexed PyPI release
        env:
          VORTEX_VERSION: ${{ needs.assemble-testpypi-vortex.outputs.vortex_version }}
        run: |
          python -I vane-extension-ci-tools/scripts/vane_provider_release.py verify-index \
            --manifest vane-extension-release.toml --extension-root . \
            --vane-source vane --ci-tools-version "$(git rev-parse HEAD:vane-extension-ci-tools)" \
            --config vane-provider-release.toml --directory dist --index pypi \
            --provider vortex --version "$VORTEX_VERSION"
