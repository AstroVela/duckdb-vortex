name: Vane Extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  vane-extension:
    # The reusable workflow verifies this SHA against its GitHub job metadata
    # and the committed vane-extension-ci-tools gitlink before running code.
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@28c253d71645b627e90307a8c0f42bf74bda0046
    with:
      ci_tools_version: 28c253d71645b627e90307a8c0f42bf74bda0046
      manifest: vane-extension.toml
      build_jobs: 8
      run_native_tests: true

  vane-distributed-protocol:
    name: Vane C++ explicit distributed scan protocol
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VANE_BUILD_JOBS: 8
      CARGO_BUILD_JOBS: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      VCPKG_MAX_CONCURRENCY: 8
      VCPKG_TARGET_TRIPLET: x64-linux
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-protocol-ccache
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPILERCHECK: content
      VANE_CMAKE_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout Vortex, Vane, and CI tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify pinned sources and read vcpkg baseline
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          vane_revision="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("vane-extension.toml").read_text())["vane"]["revision"])')"
          vcpkg_baseline="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("vcpkg.json").read_text())["builtin-baseline"])')"
          ci_tools_revision="$(git ls-tree HEAD vane-extension-ci-tools | awk '{print $3}')"
          [[ "$vane_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$vcpkg_baseline" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ci_tools_revision" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C vane rev-parse HEAD)" = "$vane_revision"
          test "$(git -C vane-extension-ci-tools rev-parse HEAD)" = "$ci_tools_revision"
          test -z "$(git -C vane status --porcelain)"
          test -z "$(git -C vane-extension-ci-tools status --porcelain)"
          echo "vane_revision=$vane_revision" >> "$GITHUB_OUTPUT"
          echo "vcpkg_baseline=$vcpkg_baseline" >> "$GITHUB_OUTPUT"

      - name: Install CMake, Ninja, and ccache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache
          python -m pip install "cmake>=3.29" "ninja>=1.10"

      - name: Restore protocol compiler cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-vortex-protocol-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ steps.pins.outputs.vane_revision }}

      - name: Reset protocol compiler cache statistics
        run: ccache --zero-stats

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.pins.outputs.vcpkg_baseline }}
          vcpkgDirectory: ${{ github.workspace }}/protocol-vcpkg

      - name: Build and execute the explicit scan protocol test
        shell: bash
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/protocol-vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          set -euo pipefail
          python vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest vane-extension.toml \
            --extension-root . \
            native \
            --vane-source vane \
            --build-dir build/vane-protocol \
            --jobs "$VANE_BUILD_JOBS" \
            --skip-tests
          cmake -S vane/external/duckdb -B build/vane-protocol \
            -DBUILD_VORTEX_DISTRIBUTED_TESTS=ON
          cmake --build build/vane-protocol \
            --target vortex_distributed_protocol_test \
            --parallel "$VANE_BUILD_JOBS"
          build/vane-protocol/extension/vortex/vortex_distributed_protocol_test

      - name: Report protocol compiler cache
        if: always()
        run: ccache --show-stats

  vane-wheel-local-vortex-integration:
    name: Vane wheel local Vortex integration
    needs: vane-extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VANE_RUNNER: local-fast

    steps:
      - name: Checkout Vortex extension
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download verified Vane wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vane-vortex-wheel
          path: vane-wheel

      - name: Exercise Vortex through the packaged Vane wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-vane-wheel-local-integration
          . .venv-vane-wheel-local-integration/bin/activate
          mapfile -t wheels < <(find vane-wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'expected exactly one Vane wheel, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi
          python -m pip install --disable-pip-version-check "${wheels[0]}"
          python -I test/vane/test_vane_wheel_vortex.py

  vane-wheel-ray-vortex-integration:
    name: Vane wheel two-worker Ray Vortex integration
    needs: vane-extension
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      VANE_RUNNER: ray
      RAY_DEDUP_LOGS: "0"

    steps:
      - name: Checkout Vortex extension
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Read pinned Vane revision
        id: vane
        shell: bash
        run: |
          set -euo pipefail
          revision="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("vane-extension.toml").read_text())["vane"]["revision"])')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # The retry integration reuses Vane's production-actor fault harness.
      # Checkout only its test support; the runtime itself must come from the
      # verified wheel produced by the reusable workflow.
      - name: Checkout matching Vane test support
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: AstroVela/vane
          ref: ${{ steps.vane.outputs.revision }}
          path: vane
          sparse-checkout: tests
          persist-credentials: false

      - name: Download verified Vane wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vane-vortex-wheel
          path: vane-wheel

      - name: Exercise Vortex through two Ray workers and retry
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-vane-wheel-ray-integration
          . .venv-vane-wheel-ray-integration/bin/activate
          mapfile -t wheels < <(find vane-wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'expected exactly one Vane wheel, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi
          python -m pip install --disable-pip-version-check "${wheels[0]}" pytest
          python -I -m pytest -vv \
            test/ray/test_vortex_ray_runner.py \
            test/ray/test_vortex_ray_retry.py
