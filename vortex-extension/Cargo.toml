[package]
name = "vortex-extension"
description = "C-compatible Vortex DuckDB extension artifacts"
edition = "2024"
publish = false

[lib]
name = "vortex_duckdb"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]

[dependencies]
vortex-duckdb = { git = "https://github.com/AstroVela/vortex.git", rev = "4b396b4e88909cd7c87e3b27af733947fe8e8808" }
vortex-index-spfresh = { git = "https://github.com/AstroVela/vortex.git", rev = "4b396b4e88909cd7c87e3b27af733947fe8e8808", features = ["native"], optional = true }
vortex-index-hnswlib = { git = "https://github.com/AstroVela/vortex.git", rev = "4b396b4e88909cd7c87e3b27af733947fe8e8808", features = ["native"], optional = true }

[features]
index-spfresh = ["vortex-duckdb/index", "dep:vortex-index-spfresh"]
index-hnswlib = ["vortex-duckdb/index", "dep:vortex-index-hnswlib"]

# This improved build times significantly
[profile.dev.package.vortex-fastlanes]
debug = false

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
