[package]
name = "vortex-extension"
description = "C-compatible Vortex DuckDB extension artifacts"
edition = "2024"
publish = false

[lib]
name = "vortex_duckdb"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]

[dependencies]
vortex-duckdb = { git = "https://github.com/sollhui/vortex.git", rev = "032130251ff030a3ed04df12a3a49952316b41b5" }
vortex-index-spfresh = { git = "https://github.com/sollhui/vortex.git", rev = "032130251ff030a3ed04df12a3a49952316b41b5", features = ["native"], optional = true }
vortex-index-hnswlib = { git = "https://github.com/sollhui/vortex.git", rev = "032130251ff030a3ed04df12a3a49952316b41b5", features = ["native"], optional = true }

vortex-fts = { git = "https://github.com/sollhui/vortex.git", rev = "032130251ff030a3ed04df12a3a49952316b41b5", optional = true }

[features]
index-tantivy = ["vortex-duckdb/index", "dep:vortex-fts"]
index-spfresh = ["vortex-duckdb/index", "dep:vortex-index-spfresh"]
index-hnswlib = ["vortex-duckdb/index", "dep:vortex-index-hnswlib"]

# This improved build times significantly
[profile.dev.package.vortex-fastlanes]
debug = false

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
